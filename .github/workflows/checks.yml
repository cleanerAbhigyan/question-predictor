name: Source audit checks

on:
  push:
    branches: [feature]
  pull_request:
    branches: [main, feature]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -v
      - run: python -m predictor validate registry/sources.json
      - name: Check reproducible reports and whitespace
        run: |
          python -m predictor audit registry/sources.json > /tmp/audit.md
          python -m predictor audit registry/sources.json --format json > /tmp/audit.json
          cmp /tmp/audit.md docs/SOURCE_AUDIT_REPORT.md
          cmp /tmp/audit.json registry/audit.json
          git diff --check
